<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SLM Runner — Qwen 0.8B (Wllama)</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e8e8ec;
    --muted: #8a90a0;
    --accent: #5b8cff;
    --bubble-user: #2a3550;
    --bubble-bot: #1e2230;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0 0 4px; }
  #status { font-size: 12px; color: var(--muted); }
  #progressWrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
    display: none;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.15s ease;
  }
  #modelPicker {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  #modelPicker input[type="file"] {
    color: var(--muted);
    font-size: 12px;
  }
  #loadBtn {
    padding: 4px 12px;
    font-size: 12px;
    border-radius: 8px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    color: var(--muted);
    font-size: 12px;
    background: none;
  }
  footer {
    padding: 12px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    gap: 8px;
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 120px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.stop { background: #d9534f; }
</style>
</head>
<body>

<header>
  <h1>SLM Runner — Qwen 0.8B</h1>
  <div id="status">Pilih file GGUF dari perangkatmu untuk mulai.</div>
  <div id="modelPicker">
    <input type="file" id="modelFile" accept=".gguf" />
    <button id="loadBtn">Muat Model</button>
  </div>
  <div id="progressWrap"><div id="progressBar"></div></div>
</header>

<div id="chat"></div>

<footer>
  <textarea id="input" rows="1" placeholder="Ketik pesan…" disabled></textarea>
  <button id="sendBtn" disabled>Kirim</button>
</footer>

<script type="module">
import { Wllama } from './wllama/esm/index.js';

// ====== KONFIGURASI — SESUAIKAN DI SINI ======
// Path ke file wllama.js/.wasm milikmu (relatif terhadap index.html ini)
const CONFIG_PATHS = {
  'single-thread/wllama.js':        './wllama/esm/single-thread/wllama.js',
  'single-thread/wllama.wasm':      './wllama/esm/single-thread/wllama.wasm',
  'multi-thread/wllama.js':         './wllama/esm/multi-thread/wllama.js',
  'multi-thread/wllama.wasm':       './wllama/esm/multi-thread/wllama.wasm',
  'multi-thread/wllama.worker.mjs': './wllama/esm/multi-thread/wllama.worker.mjs',
};

const SYSTEM_PROMPT = 'Kamu adalah asisten AI yang membantu, ringkas, dan berbahasa Indonesia.';
const N_PREDICT = 512;
// ==============================================

const elStatus = document.getElementById('status');
const elProgressWrap = document.getElementById('progressWrap');
const elProgressBar = document.getElementById('progressBar');
const elChat = document.getElementById('chat');
const elInput = document.getElementById('input');
const elSend = document.getElementById('sendBtn');
const elModelFile = document.getElementById('modelFile');
const elLoadBtn = document.getElementById('loadBtn');

let wllama = null;
let history = [{ role: 'system', content: SYSTEM_PROMPT }];
let generating = false;

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  elChat.appendChild(div);
  elChat.scrollTop = elChat.scrollHeight;
  return div;
}

function setStatus(text) {
  elStatus.textContent = text;
}

async function loadModelFromLocalFile() {
  const files = elModelFile.files;
  if (!files || files.length === 0) {
    setStatus('Pilih file .gguf dulu.');
    return;
  }

  elLoadBtn.disabled = true;
  elModelFile.disabled = true;
  addMsg('system', `Memuat model dari file lokal: ${files[0].name}`);
  elProgressWrap.style.display = 'block';

  try {
    wllama = new Wllama(CONFIG_PATHS);
    // wllama.loadModel menerima File/Blob langsung — model tidak pernah
    // dikirim ke server mana pun, semua diproses di browser.
    await wllama.loadModel([files[0]], {
      n_ctx: 4096,
      progressCallback: ({ loaded, total }) => {
        const pct = total ? Math.round((loaded / total) * 100) : 0;
        elProgressBar.style.width = pct + '%';
        setStatus(`Memuat model… ${pct}%`);
      },
    });
    elProgressWrap.style.display = 'none';
    setStatus('Model siap.');
    elInput.disabled = false;
    elSend.disabled = false;
    elInput.focus();
  } catch (err) {
    console.error(err);
    setStatus('Gagal memuat model — cek console.');
    elLoadBtn.disabled = false;
    elModelFile.disabled = false;
  }
}

async function send() {
  const text = elInput.value.trim();
  if (!text || generating) return;

  elInput.value = '';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  generating = true;
  elSend.textContent = 'Stop';
  elSend.classList.add('stop');
  elInput.disabled = true;

  const botDiv = addMsg('bot', '');
  let full = '';

  try {
    const reply = await wllama.createChatCompletion(history, {
      nPredict: N_PREDICT,
      sampling: { temp: 0.7, top_k: 40, top_p: 0.9 },
      onNewToken: (token, piece, currentText) => {
        full = currentText;
        botDiv.textContent = full;
        elChat.scrollTop = elChat.scrollHeight;
      },
    });
    full = reply || full;
    botDiv.textContent = full;
    history.push({ role: 'assistant', content: full });
  } catch (err) {
    console.error(err);
    botDiv.textContent = '[error saat generate — lihat console]';
  } finally {
    generating = false;
    elSend.textContent = 'Kirim';
    elSend.classList.remove('stop');
    elInput.disabled = false;
    elInput.focus();
  }
}

elSend.addEventListener('click', () => {
  if (generating) {
    wllama?.stopCompletion?.();
  } else {
    send();
  }
});

elInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

elLoadBtn.addEventListener('click', loadModelFromLocalFile);
</script>
</body>
</html>
